<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">ChatGPT, Claude and Gemini comparison</title>
  <desc id="description">Three equal panels compare the assistants using tasks, limits, integrations and cost.</desc>
  <rect width="1600" height="900" fill="#f3efe5"/>
  <rect x="90" y="74" width="1420" height="752" rx="30" fill="#fffdf7" stroke="#292c28" stroke-width="3"/>
  <text x="140" y="160" fill="#292c28" font-family="Arial, sans-serif" font-size="58" font-weight="700">ChatGPT vs Claude vs Gemini</text>
  <text x="140" y="216" fill="#5b6256" font-family="Arial, sans-serif" font-size="27">Which one should a solo business pay for?</text>
  <g font-family="Arial, sans-serif">
    <rect x="140" y="290" width="405" height="320" rx="24" fill="#f7f4eb" stroke="#7a806b" stroke-width="2"/>
    <rect x="598" y="290" width="405" height="320" rx="24" fill="#f7f4eb" stroke="#7a806b" stroke-width="2"/>
    <rect x="1055" y="290" width="405" height="320" rx="24" fill="#f7f4eb" stroke="#7a806b" stroke-width="2"/>
    <text x="342" y="372" text-anchor="middle" fill="#292c28" font-size="40" font-weight="700">ChatGPT</text>
    <text x="800" y="372" text-anchor="middle" fill="#292c28" font-size="40" font-weight="700">Claude</text>
    <text x="1258" y="372" text-anchor="middle" fill="#292c28" font-size="40" font-weight="700">Gemini</text>
    <g fill="#7a806b">
      <circle cx="342" cy="465" r="45"/><circle cx="800" cy="465" r="45"/><circle cx="1258" cy="465" r="45"/>
    </g>
    <g fill="#fffdf7" font-size="44" font-weight="700" text-anchor="middle">
      <text x="342" y="481">1</text><text x="800" y="481">1</text><text x="1258" y="481">1</text>
    </g>
    <g fill="#5b6256" font-size="24" text-anchor="middle">
      <text x="342" y="555">One primary assistant</text><text x="800" y="555">One primary assistant</text><text x="1258" y="555">One primary assistant</text>
    </g>
    <rect x="310" y="668" width="980" height="86" rx="43" fill="#292c28"/>
    <text x="800" y="723" text-anchor="middle" fill="#f3efe5" font-size="30" font-weight="700">tasks · limits · integrations · cost</text>
  </g>
</svg>

