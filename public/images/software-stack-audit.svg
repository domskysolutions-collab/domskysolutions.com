<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Software stack audit worksheet</title>
  <desc id="desc">A neutral decision worksheet sorting software subscriptions into keep, downgrade, cancel and trial columns.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12172b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity=".36"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="280" fill="#23d5d5" opacity=".05"/><circle cx="100" cy="820" r="300" fill="#f4b942" opacity=".06"/>
  <text x="130" y="145" fill="#9ca3af" font-family="Arial, sans-serif" font-size="24" letter-spacing="5">LEAN SOFTWARE STACK</text>
  <text x="130" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="64" font-weight="700">Software stack audit</text>
  <text x="130" y="275" fill="#aeb7c7" font-family="Arial, sans-serif" font-size="26">Map required jobs. Test coverage. Count recurring cash honestly.</text>
  <g transform="translate(130 350)" filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(0 0)"><rect width="310" height="330" rx="24" fill="#111c2e" stroke="#23d5d5" stroke-opacity=".55"/><text x="28" y="55" fill="#23d5d5" font-size="24" font-weight="700">KEEP</text><rect x="28" y="90" width="254" height="58" rx="12" fill="#18263b"/><rect x="28" y="170" width="214" height="18" rx="9" fill="#516074"/><rect x="28" y="208" width="246" height="18" rx="9" fill="#334155"/><rect x="28" y="246" width="180" height="18" rx="9" fill="#334155"/></g>
    <g transform="translate(335 0)"><rect width="310" height="330" rx="24" fill="#111c2e" stroke="#f4b942" stroke-opacity=".55"/><text x="28" y="55" fill="#f4b942" font-size="24" font-weight="700">DOWNGRADE</text><rect x="28" y="90" width="254" height="58" rx="12" fill="#18263b"/><rect x="28" y="170" width="230" height="18" rx="9" fill="#516074"/><rect x="28" y="208" width="190" height="18" rx="9" fill="#334155"/><rect x="28" y="246" width="246" height="18" rx="9" fill="#334155"/></g>
    <g transform="translate(670 0)"><rect width="310" height="330" rx="24" fill="#111c2e" stroke="#e87979" stroke-opacity=".5"/><text x="28" y="55" fill="#f09a9a" font-size="24" font-weight="700">CANCEL</text><rect x="28" y="90" width="254" height="58" rx="12" fill="#18263b"/><rect x="28" y="170" width="196" height="18" rx="9" fill="#516074"/><rect x="28" y="208" width="242" height="18" rx="9" fill="#334155"/><rect x="28" y="246" width="210" height="18" rx="9" fill="#334155"/></g>
    <g transform="translate(1005 0)"><rect width="310" height="330" rx="24" fill="#111c2e" stroke="#9b8afb" stroke-opacity=".55"/><text x="28" y="55" fill="#b4a9ff" font-size="24" font-weight="700">TRIAL</text><rect x="28" y="90" width="254" height="58" rx="12" fill="#18263b"/><rect x="28" y="170" width="235" height="18" rx="9" fill="#516074"/><rect x="28" y="208" width="205" height="18" rx="9" fill="#334155"/><rect x="28" y="246" width="248" height="18" rx="9" fill="#334155"/></g>
  </g>
  <text x="130" y="790" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Recurring cash  ·  Migration cost  ·  Owner time</text>
  <text x="1470" y="820" text-anchor="end" fill="#6b7280" font-family="Arial, sans-serif" font-size="22">DOMSKY SOLUTIONS</text>
</svg>
