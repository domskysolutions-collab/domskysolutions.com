<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Codex versus Claude Code supervised workflow</title>
  <desc id="description">One small website task splits into Codex and Claude Code lanes before converging at a review-the-diff checklist and accepted change.</desc>
  <rect width="1600" height="900" fill="#F4EFE5"/>
  <rect x="82" y="72" width="1436" height="756" rx="34" fill="#FFFDF8" stroke="#292C28" stroke-width="3"/>
  <text x="136" y="170" fill="#292C28" font-family="Arial, sans-serif" font-size="66" font-weight="700">Codex vs Claude Code</text>
  <text x="138" y="224" fill="#69705F" font-family="Arial, sans-serif" font-size="30">Cost, control and review effort</text>
  <g font-family="Arial, sans-serif">
    <rect x="136" y="330" width="270" height="178" rx="22" fill="#F4EFE5" stroke="#292C28" stroke-width="2"/>
    <text x="271" y="395" text-anchor="middle" fill="#292C28" font-size="24" font-weight="700">SMALL WEBSITE</text>
    <text x="271" y="430" text-anchor="middle" fill="#292C28" font-size="24" font-weight="700">TASK</text>
    <text x="271" y="474" text-anchor="middle" fill="#69705F" font-size="19">One bounded change</text>
    <path d="M406 419 H520 M520 419 V334 H606 M520 419 V504 H606" fill="none" stroke="#7A806B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="606" y="275" width="330" height="118" rx="22" fill="#E8E8DA" stroke="#7A806B" stroke-width="3"/>
    <text x="771" y="346" text-anchor="middle" fill="#292C28" font-size="35" font-weight="700">CODEX</text>
    <rect x="606" y="445" width="330" height="118" rx="22" fill="#E8E8DA" stroke="#7A806B" stroke-width="3"/>
    <text x="771" y="516" text-anchor="middle" fill="#292C28" font-size="35" font-weight="700">CLAUDE CODE</text>
    <path d="M936 334 H1036 V419 M936 504 H1036 V419 H1110" fill="none" stroke="#7A806B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1110" y="322" width="332" height="194" rx="22" fill="#292C28"/>
    <text x="1276" y="390" text-anchor="middle" fill="#FFFDF8" font-size="31" font-weight="700">REVIEW THE DIFF</text>
    <text x="1160" y="435" fill="#D6D8C9" font-size="20">✓ Test the requirement</text>
    <text x="1160" y="468" fill="#D6D8C9" font-size="20">✓ Check nearby behavior</text>
    <text x="1160" y="501" fill="#D6D8C9" font-size="20">✓ Accept, revise or reject</text>
    <path d="M1276 516 V626" stroke="#C36C3B" stroke-width="8" stroke-linecap="round"/>
    <rect x="1086" y="626" width="380" height="96" rx="48" fill="#C36C3B"/>
    <text x="1276" y="686" text-anchor="middle" fill="#FFFDF8" font-size="30" font-weight="700">ACCEPTED CHANGE</text>
  </g>
  <text x="136" y="765" fill="#69705F" font-family="Arial, sans-serif" font-size="23">One task. Two supervised workflows. The same review standard.</text>
</svg>

