<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="title">
<title id="title">An approved article supplies consistent facts and a core conclusion to distinct email and LinkedIn drafts; distribution still requires approval.</title>
<desc>An approved article supplies consistent facts and a core conclusion to distinct email and LinkedIn drafts; distribution still requires approval. Original Domsky editorial diagram; details and evidence remain in the article.</desc>
<rect x="0" y="0" width="1000" height="1500" rx="0" fill="#F4F0E8" stroke="none" stroke-width="2"/><text x="70" y="80" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="28" font-weight="700"><tspan x="70" dy="0">ONE FACTUAL CORE · THREE FORMATS</tspan></text><text x="70" y="145" fill="#2B2A28" font-family="Lora, Georgia, serif" font-size="43" font-weight="400"><tspan x="70" dy="0">Adapt the delivery. Keep the evidence.</tspan></text><rect x="70" y="205" width="860" height="155" rx="0" fill="#DFE7DE" stroke="none" stroke-width="2"/><text x="100" y="259" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="700"><tspan x="100" dy="0">SOURCE-SUPPORTED FACTUAL CORE</tspan></text><text x="100" y="319" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="46" font-weight="400"><tspan x="100" dy="0">Approved facts + core conclusion</tspan></text><path d="M500 365 V405" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M493.0 393.0 L500.0 405.0 L507.0 393.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="70" y="420" width="860" height="230" rx="0" fill="#2F5D5A" stroke="none" stroke-width="2"/><text x="100" y="477" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="34" font-weight="700"><tspan x="100" dy="0">01  APPROVED ARTICLE</tspan></text><text x="100" y="540" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="46" font-weight="400"><tspan x="100" dy="0">Full explanation + evidence</tspan><tspan x="100" dy="57">Context, boundaries, next decision</tspan></text><path d="M500 654 V705" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M493.0 693.0 L500.0 705.0 L507.0 693.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><text x="70" y="758" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="700"><tspan x="70" dy="0">ADAPT ONLY AFTER ARTICLE APPROVAL</tspan></text><rect x="70" y="800" width="860" height="225" rx="0" fill="#F4F0E8" stroke="#BDC4B6" stroke-width="2"/><text x="100" y="855" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="34" font-weight="700"><tspan x="100" dy="0">02  EMAIL DRAFT</tspan></text><text x="100" y="922" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="46" font-weight="400"><tspan x="100" dy="0">One useful insight + one action</tspan><tspan x="100" dy="57">New opening; shorter explanation</tspan></text><rect x="70" y="1060" width="860" height="225" rx="0" fill="#F4F0E8" stroke="#BDC4B6" stroke-width="2"/><text x="100" y="1115" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="34" font-weight="700"><tspan x="100" dy="0">03  LINKEDIN DRAFT</tspan></text><text x="100" y="1182" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="46" font-weight="400"><tspan x="100" dy="0">Self-contained observation</tspan><tspan x="100" dy="57">New structure; mobile line breaks</tspan></text><text x="70" y="1360" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="33" font-weight="400"><tspan x="70" dy="0">Change opening, structure, depth and action.</tspan><tspan x="70" dy="41">Review before distribution. These example</tspan><tspan x="70" dy="41">drafts were not sent, posted or measured.</tspan></text>
