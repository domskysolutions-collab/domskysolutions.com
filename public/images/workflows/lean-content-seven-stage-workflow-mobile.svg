<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="title">
<title id="title">Seven stages from defining the question to the release check, with human approval at the argument and corrected-article stages.</title>
<desc>Seven stages from defining the question to the release check, with human approval at the argument and corrected-article stages. Original Domsky editorial diagram; details and evidence remain in the article.</desc>
<rect x="0" y="0" width="1000" height="1500" rx="0" fill="#F4F0E8" stroke="none" stroke-width="2"/><text x="70" y="80" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="28" font-weight="700"><tspan x="70" dy="0">THE EDITORIAL WORKFLOW</tspan></text><text x="70" y="145" fill="#2B2A28" font-family="Lora, Georgia, serif" font-size="44" font-weight="400"><tspan x="70" dy="0">Seven stages. Two approval gates.</tspan></text><rect x="70" y="205" width="860" height="140" rx="0" fill="#F4F0E8" stroke="#2F5D5A" stroke-width="2"/><text x="96" y="268" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="44" font-weight="700"><tspan x="96" dy="0">01</tspan></text><text x="195" y="261" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="49" font-weight="700"><tspan x="195" dy="0">Define the question</tspan></text><text x="195" y="313" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="400"><tspan x="195" dy="0">Reader + scope</tspan></text><path d="M500 345 V362" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M493.0 350.0 L500.0 362.0 L507.0 350.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="70" y="370" width="860" height="140" rx="0" fill="#F4F0E8" stroke="#2F5D5A" stroke-width="2"/><text x="96" y="433" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="44" font-weight="700"><tspan x="96" dy="0">02</tspan></text><text x="195" y="426" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="49" font-weight="700"><tspan x="195" dy="0">Build the source ledger</tspan></text><text x="195" y="478" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="400"><tspan x="195" dy="0">Claims + dated sources</tspan></text><path d="M500 510 V527" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M493.0 515.0 L500.0 527.0 L507.0 515.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="70" y="535" width="860" height="140" rx="0" fill="#2F5D5A" stroke="#2F5D5A" stroke-width="2"/><text x="96" y="598" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="44" font-weight="700"><tspan x="96" dy="0">03</tspan></text><text x="195" y="591" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="49" font-weight="700"><tspan x="195" dy="0">Approve the argument</tspan></text><text x="195" y="643" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="400"><tspan x="195" dy="0">HUMAN APPROVAL</tspan></text><path d="M500 675 V692" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M493.0 680.0 L500.0 692.0 L507.0 680.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="70" y="700" width="860" height="140" rx="0" fill="#F4F0E8" stroke="#2F5D5A" stroke-width="2"/><text x="96" y="763" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="44" font-weight="700"><tspan x="96" dy="0">04</tspan></text><text x="195" y="756" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="49" font-weight="700"><tspan x="195" dy="0">Draft with claim references</tspan></text><text x="195" y="808" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="400"><tspan x="195" dy="0">Source IDs retained</tspan></text><path d="M500 840 V857" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M493.0 845.0 L500.0 857.0 L507.0 845.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="70" y="865" width="860" height="140" rx="0" fill="#2F5D5A" stroke="#2F5D5A" stroke-width="2"/><text x="96" y="928" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="44" font-weight="700"><tspan x="96" dy="0">05</tspan></text><text x="195" y="921" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="49" font-weight="700"><tspan x="195" dy="0">Correct and approve</tspan></text><text x="195" y="973" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="400"><tspan x="195" dy="0">HUMAN APPROVAL</tspan></text><path d="M500 1005 V1022" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M493.0 1010.0 L500.0 1022.0 L507.0 1010.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="70" y="1030" width="860" height="140" rx="0" fill="#F4F0E8" stroke="#2F5D5A" stroke-width="2"/><text x="96" y="1093" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="44" font-weight="700"><tspan x="96" dy="0">06</tspan></text><text x="195" y="1086" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="49" font-weight="700"><tspan x="195" dy="0">Adapt for each format</tspan></text><text x="195" y="1138" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="400"><tspan x="195" dy="0">Channel-specific drafts</tspan></text><path d="M500 1170 V1187" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M493.0 1175.0 L500.0 1187.0 L507.0 1175.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="70" y="1195" width="860" height="140" rx="0" fill="#DFE7DE" stroke="#2F5D5A" stroke-width="2"/><text x="96" y="1258" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="44" font-weight="700"><tspan x="96" dy="0">07</tspan></text><text x="195" y="1251" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="49" font-weight="700"><tspan x="195" dy="0">Run the release check</tspan></text><text x="195" y="1303" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="400"><tspan x="195" dy="0">Manual release check</tspan></text><rect x="70" y="1400" width="860" height="3" rx="0" fill="#B99963" stroke="none" stroke-width="2"/><text x="70" y="1448" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="400"><tspan x="70" dy="0">Approve before drafting. Approve before adapting.</tspan></text>
</svg>