<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A Lean Solo-Business Stack</title>
  <desc id="desc">Three task-based software paths for a writer, service provider and small website builder, each checking existing tools before adding or skipping capabilities.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1d2118" flood-opacity=".13"/></filter></defs>
  <rect width="1600" height="900" fill="#f3f0e8"/>
  <path d="M0 740C360 650 540 840 910 735s470-86 690-16v181H0z" fill="#dfe3d3"/>
  <text x="120" y="120" fill="#24271f" font-family="Arial, sans-serif" font-size="60" font-weight="700">A Lean Solo-Business Stack</text>
  <text x="120" y="174" fill="#626858" font-family="Arial, sans-serif" font-size="28">USE  ·  KEEP  ·  SKIP</text>
  <g font-family="Arial, sans-serif" filter="url(#s)">
    <g transform="translate(120 245)"><rect width="420" height="410" rx="26" fill="#fffdf7" stroke="#b8bea8"/><text x="34" y="60" fill="#24271f" font-size="28" font-weight="700">WRITER</text><text x="34" y="103" fill="#6b725f" font-size="20">Publish one useful article</text><rect x="34" y="138" width="352" height="62" rx="13" fill="#e8ebdf"/><text x="58" y="178" fill="#34392e" font-size="20">Existing editor?</text><path d="M210 200v35" stroke="#8b927c" stroke-width="3"/><rect x="34" y="235" width="164" height="74" rx="13" fill="#6f775e"/><text x="61" y="280" fill="white" font-size="19" font-weight="700">KEEP</text><rect x="222" y="235" width="164" height="74" rx="13" fill="#d8ddca"/><text x="249" y="268" fill="#34392e" font-size="18" font-weight="700">TRIAL</text><text x="249" y="291" fill="#59604f" font-size="15">one gap</text><rect x="34" y="332" width="352" height="44" rx="12" fill="none" stroke="#c7cbbd" stroke-dasharray="8 7"/><text x="58" y="361" fill="#777d6e" font-size="17">Later: email, scheduling, design</text></g>
    <g transform="translate(590 245)"><rect width="420" height="410" rx="26" fill="#fffdf7" stroke="#b8bea8"/><text x="34" y="60" fill="#24271f" font-size="28" font-weight="700">SERVICE PROVIDER</text><text x="34" y="103" fill="#6b725f" font-size="20">Deliver client work reliably</text><rect x="34" y="138" width="352" height="62" rx="13" fill="#e8ebdf"/><text x="58" y="178" fill="#34392e" font-size="20">Current delivery works?</text><path d="M210 200v35" stroke="#8b927c" stroke-width="3"/><rect x="34" y="235" width="164" height="74" rx="13" fill="#6f775e"/><text x="61" y="280" fill="white" font-size="19" font-weight="700">KEEP</text><rect x="222" y="235" width="164" height="74" rx="13" fill="#d8ddca"/><text x="249" y="268" fill="#34392e" font-size="18" font-weight="700">FIX</text><text x="249" y="291" fill="#59604f" font-size="15">observed gap</text><rect x="34" y="332" width="352" height="44" rx="12" fill="none" stroke="#c7cbbd" stroke-dasharray="8 7"/><text x="58" y="361" fill="#777d6e" font-size="17">Skip: default CRM and automation</text></g>
    <g transform="translate(1060 245)"><rect width="420" height="410" rx="26" fill="#fffdf7" stroke="#b8bea8"/><text x="34" y="60" fill="#24271f" font-size="28" font-weight="700">SMALL WEBSITE</text><text x="34" y="103" fill="#6b725f" font-size="20">Maintain a safe publishing path</text><rect x="34" y="138" width="352" height="62" rx="13" fill="#e8ebdf"/><text x="58" y="178" fill="#34392e" font-size="20">Can you maintain it?</text><path d="M210 200v35" stroke="#8b927c" stroke-width="3"/><rect x="34" y="235" width="164" height="74" rx="13" fill="#6f775e"/><text x="61" y="280" fill="white" font-size="19" font-weight="700">KEEP</text><rect x="222" y="235" width="164" height="74" rx="13" fill="#d8ddca"/><text x="249" y="268" fill="#34392e" font-size="18" font-weight="700">CHOOSE</text><text x="249" y="291" fill="#59604f" font-size="15">one path</text><rect x="34" y="332" width="352" height="44" rx="12" fill="none" stroke="#c7cbbd" stroke-dasharray="8 7"/><text x="58" y="361" fill="#777d6e" font-size="17">Later: extra CMS or monitoring</text></g>
  </g>
  <text x="120" y="800" fill="#34392e" font-family="Arial, sans-serif" font-size="25" font-weight="700">Existing tools?  →  Current gap?  →  Trial one capability  →  Count incremental cost</text>
  <text x="1480" y="842" text-anchor="end" fill="#747a6b" font-family="Arial, sans-serif" font-size="20">DOMSKY SOLUTIONS</text>
</svg>
