<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="title">
<title id="title">The September 2026 Kit example connects a rejected claim to the specific help article, correction and approved wording.</title>
<desc>The September 2026 Kit example connects a rejected claim to the specific help article, correction and approved wording. Original Domsky editorial diagram; details and evidence remain in the article.</desc>
<rect x="0" y="0" width="1000" height="1500" rx="0" fill="#F4F0E8" stroke="none" stroke-width="2"/><text x="70" y="80" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="28" font-weight="700"><tspan x="70" dy="0">A CLAIM BECOMES PUBLISHABLE</tspan></text><text x="70" y="145" fill="#2B2A28" font-family="Lora, Georgia, serif" font-size="56" font-weight="400"><tspan x="70" dy="0">The Kit correction</tspan></text><text x="70" y="198" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="400"><tspan x="70" dy="0">Documented example · 25 September 2026</tspan></text><rect x="70" y="245" width="860" height="205" rx="0" fill="#DFE7DE" stroke="#2F5D5A" stroke-width="2"/><text x="100" y="295" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="29" font-weight="700"><tspan x="100" dy="0">01  SOURCE</tspan></text><text x="100" y="357" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="46" font-weight="400"><tspan x="100" dy="0">Kit Help: Visual Automations</tspan><tspan x="100" dy="57">on the Newsletter Plan</tspan></text><path d="M500 453 V472" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M493.0 460.0 L500.0 472.0 L507.0 460.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="70" y="480" width="860" height="225" rx="0" fill="#F4F0E8" stroke="#9C5A4D" stroke-width="2"/><text x="100" y="530" fill="#9C5A4D" font-family="DM Sans, Arial, sans-serif" font-size="29" font-weight="700"><tspan x="100" dy="0">02  REJECTED DRAFT CLAIM</tspan></text><text x="100" y="592" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="46" font-weight="400"><tspan x="100" dy="0">“Kit Free does not include</tspan><tspan x="100" dy="57">sequences or visual automation.”</tspan></text><path d="M500 708 V727" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M493.0 715.0 L500.0 727.0 L507.0 715.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="70" y="735" width="860" height="250" rx="0" fill="#DFE7DE" stroke="#2F5D5A" stroke-width="2"/><text x="100" y="785" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="29" font-weight="700"><tspan x="100" dy="0">03  VERIFY AND CORRECT</tspan></text><text x="100" y="847" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="46" font-weight="400"><tspan x="100" dy="0">Specific help article includes</tspan><tspan x="100" dy="57">one Email Sequence and one</tspan><tspan x="100" dy="57">basic Visual Automation.</tspan></text><path d="M500 988 V1007" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M493.0 995.0 L500.0 1007.0 L507.0 995.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="70" y="1015" width="860" height="350" rx="0" fill="#2F5D5A" stroke="#2F5D5A" stroke-width="2"/><text x="100" y="1065" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="29" font-weight="700"><tspan x="100" dy="0">04  APPROVED WORDING</tspan></text><text x="100" y="1127" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="46" font-weight="400"><tspan x="100" dy="0">Kit Free includes one sequence</tspan><tspan x="100" dy="57">and one basic action-only</tspan><tspan x="100" dy="57">automation; paid plans add</tspan><tspan x="100" dy="57">unlimited sequences and</tspan><tspan x="100" dy="57">advanced automation.</tspan></text><text x="70" y="1430" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="400"><tspan x="70" dy="0">Historical example, not new verification.</tspan><tspan x="70" dy="38">Recheck provider limits before release.</tspan></text>
</svg>