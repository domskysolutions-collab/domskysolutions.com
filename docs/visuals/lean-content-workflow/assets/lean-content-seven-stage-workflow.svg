<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title">
<title id="title">Seven stages from defining the question to the release check, with human approval at the argument and corrected-article stages.</title>
<desc>Seven stages from defining the question to the release check, with human approval at the argument and corrected-article stages. Original Domsky editorial diagram; details and evidence remain in the article.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#F4F0E8" stroke="none" stroke-width="2"/><text x="80" y="80" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="28" font-weight="700"><tspan x="80" dy="0">THE EDITORIAL WORKFLOW</tspan></text><text x="80" y="145" fill="#2B2A28" font-family="Lora, Georgia, serif" font-size="52" font-weight="400"><tspan x="80" dy="0">Seven stages. Two approval gates.</tspan></text><rect x="80" y="225" width="330" height="210" rx="0" fill="#F4F0E8" stroke="#2F5D5A" stroke-width="2"/><text x="104" y="269" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="700"><tspan x="104" dy="0">01</tspan></text><text x="104" y="325" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="40" font-weight="700"><tspan x="104" dy="0">Define the</tspan><tspan x="104" dy="49">question</tspan></text><path d="M410 330 H438" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M426.0 337.0 L438.0 330.0 L426.0 323.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="450" y="225" width="330" height="210" rx="0" fill="#F4F0E8" stroke="#2F5D5A" stroke-width="2"/><text x="474" y="269" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="700"><tspan x="474" dy="0">02</tspan></text><text x="474" y="325" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="40" font-weight="700"><tspan x="474" dy="0">Build the</tspan><tspan x="474" dy="49">source ledger</tspan></text><path d="M780 330 H808" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M796.0 337.0 L808.0 330.0 L796.0 323.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="820" y="225" width="330" height="210" rx="0" fill="#2F5D5A" stroke="#2F5D5A" stroke-width="2"/><text x="844" y="269" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="700"><tspan x="844" dy="0">03</tspan></text><text x="844" y="325" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="40" font-weight="700"><tspan x="844" dy="0">Approve the</tspan><tspan x="844" dy="49">argument</tspan></text><text x="844" y="409" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="700"><tspan x="844" dy="0">HUMAN APPROVAL</tspan></text><path d="M1150 330 H1178" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M1166.0 337.0 L1178.0 330.0 L1166.0 323.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="1190" y="225" width="330" height="210" rx="0" fill="#F4F0E8" stroke="#2F5D5A" stroke-width="2"/><text x="1214" y="269" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="700"><tspan x="1214" dy="0">04</tspan></text><text x="1214" y="325" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="36" font-weight="700"><tspan x="1214" dy="0">Draft with</tspan><tspan x="1214" dy="44">claim references</tspan></text><path d="M1355 435 V543" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M1348.0 531.0 L1355.0 543.0 L1362.0 531.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="1190" y="555" width="330" height="210" rx="0" fill="#2F5D5A" stroke="#2F5D5A" stroke-width="2"/><text x="1214" y="599" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="700"><tspan x="1214" dy="0">05</tspan></text><text x="1214" y="655" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="40" font-weight="700"><tspan x="1214" dy="0">Correct</tspan><tspan x="1214" dy="49">and approve</tspan></text><text x="1214" y="739" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="700"><tspan x="1214" dy="0">HUMAN APPROVAL</tspan></text><path d="M1190 660 H977" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M989.0 653.0 L977.0 660.0 L989.0 667.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="635" y="555" width="330" height="210" rx="0" fill="#F4F0E8" stroke="#2F5D5A" stroke-width="2"/><text x="659" y="599" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="700"><tspan x="659" dy="0">06</tspan></text><text x="659" y="655" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="40" font-weight="700"><tspan x="659" dy="0">Adapt for</tspan><tspan x="659" dy="49">each format</tspan></text><path d="M635 660 H422" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M434.0 653.0 L422.0 660.0 L434.0 667.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="80" y="555" width="330" height="210" rx="0" fill="#DFE7DE" stroke="#2F5D5A" stroke-width="2"/><text x="104" y="599" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="700"><tspan x="104" dy="0">07</tspan></text><text x="104" y="655" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="40" font-weight="700"><tspan x="104" dy="0">Run the</tspan><tspan x="104" dy="49">release check</tspan></text><text x="104" y="739" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="700"><tspan x="104" dy="0">MANUAL CHECK</tspan></text><rect x="80" y="824" width="1440" height="3" rx="0" fill="#B99963" stroke="none" stroke-width="2"/><text x="80" y="870" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="400"><tspan x="80" dy="0">Approve the argument before drafting; approve the article before adapting.</tspan></text>
