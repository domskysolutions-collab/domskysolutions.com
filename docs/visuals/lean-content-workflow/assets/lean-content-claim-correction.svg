<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title">
<title id="title">The September 2026 Kit example connects a rejected claim to the specific help article, correction and approved wording.</title>
<desc>The September 2026 Kit example connects a rejected claim to the specific help article, correction and approved wording. Original Domsky editorial diagram; details and evidence remain in the article.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#F4F0E8" stroke="none" stroke-width="2"/><text x="80" y="80" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="28" font-weight="700"><tspan x="80" dy="0">A CLAIM BECOMES PUBLISHABLE</tspan></text><text x="80" y="145" fill="#2B2A28" font-family="Lora, Georgia, serif" font-size="56" font-weight="400"><tspan x="80" dy="0">The Kit correction</tspan></text><text x="80" y="198" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="400"><tspan x="80" dy="0">Documented example · 25 September 2026</tspan></text><rect x="80" y="245" width="1440" height="110" rx="0" fill="#DFE7DE" stroke="#BDC4B6" stroke-width="2"/><text x="104" y="297" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="700"><tspan x="104" dy="0">01  SOURCE</tspan></text><text x="455" y="293" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="32" font-weight="400"><tspan x="455" dy="0">Kit Help: Visual Automations on the Newsletter Plan</tspan></text><path d="M260 357 V375" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M253.0 363.0 L260.0 375.0 L267.0 363.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="80" y="380" width="1440" height="110" rx="0" fill="#F4F0E8" stroke="#9C5A4D" stroke-width="2"/><text x="104" y="432" fill="#9C5A4D" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="700"><tspan x="104" dy="0">02  REJECTED CLAIM</tspan></text><text x="455" y="428" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="32" font-weight="400"><tspan x="455" dy="0">“Kit Free does not include sequences or visual automation.”</tspan></text><path d="M260 492 V510" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M253.0 498.0 L260.0 510.0 L267.0 498.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="80" y="515" width="1440" height="125" rx="0" fill="#DFE7DE" stroke="#BDC4B6" stroke-width="2"/><text x="104" y="567" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="700"><tspan x="104" dy="0">03  CORRECTION</tspan></text><text x="455" y="563" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="32" font-weight="400"><tspan x="455" dy="0">Specific help article includes one Email Sequence</tspan><tspan x="455" dy="39">and one basic Visual Automation.</tspan></text><path d="M260 642 V660" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M253.0 648.0 L260.0 660.0 L267.0 648.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="80" y="665" width="1440" height="155" rx="0" fill="#2F5D5A" stroke="#BDC4B6" stroke-width="2"/><text x="104" y="717" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="700"><tspan x="104" dy="0">04  APPROVED WORDING</tspan></text><text x="455" y="713" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="32" font-weight="400"><tspan x="455" dy="0">Kit Free includes one sequence and one basic action-only</tspan><tspan x="455" dy="39">automation; paid plans add unlimited sequences and</tspan><tspan x="455" dy="39">advanced automation.</tspan></text><text x="80" y="870" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="29" font-weight="400"><tspan x="80" dy="0">Historical example, not new verification. Recheck provider limits before release.</tspan></text>
</svg>