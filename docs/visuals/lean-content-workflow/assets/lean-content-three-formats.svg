<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title">
<title id="title">An approved article supplies consistent facts and a core conclusion to distinct email and LinkedIn drafts; distribution still requires approval.</title>
<desc>An approved article supplies consistent facts and a core conclusion to distinct email and LinkedIn drafts; distribution still requires approval. Original Domsky editorial diagram; details and evidence remain in the article.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#F4F0E8" stroke="none" stroke-width="2"/><text x="80" y="80" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="28" font-weight="700"><tspan x="80" dy="0">ONE FACTUAL CORE · THREE FORMATS</tspan></text><text x="80" y="145" fill="#2B2A28" font-family="Lora, Georgia, serif" font-size="52" font-weight="400"><tspan x="80" dy="0">Adapt the delivery. Keep the evidence.</tspan></text><rect x="80" y="210" width="1440" height="110" rx="0" fill="#DFE7DE" stroke="none" stroke-width="2"/><text x="110" y="256" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="700"><tspan x="110" dy="0">SOURCE-SUPPORTED FACTUAL CORE</tspan></text><text x="110" y="298" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="400"><tspan x="110" dy="0">Keep approved facts and the core conclusion consistent.</tspan></text><path d="M800 322 V360" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M793.0 348.0 L800.0 360.0 L807.0 348.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="420" y="375" width="760" height="135" rx="0" fill="#2F5D5A" stroke="none" stroke-width="2"/><text x="452" y="424" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="700"><tspan x="452" dy="0">01  APPROVED ARTICLE</tspan></text><text x="452" y="475" fill="#F4F0E8" font-family="DM Sans, Arial, sans-serif" font-size="32" font-weight="400"><tspan x="452" dy="0">Full explanation, evidence and next decision</tspan></text><path d="M800 515 V550 H420 V587" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M413.0 575.0 L420.0 587.0 L427.0 575.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M800 550 H1180 V587" fill="none" stroke="#2F5D5A" stroke-width="4"/><path d="M1173.0 575.0 L1180.0 587.0 L1187.0 575.0" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="80" y="600" width="680" height="165" rx="0" fill="#F4F0E8" stroke="#BDC4B6" stroke-width="2"/><text x="108" y="648" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="700"><tspan x="108" dy="0">02  EMAIL DRAFT</tspan></text><text x="108" y="700" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="400"><tspan x="108" dy="0">One useful insight + one action</tspan><tspan x="108" dy="38">New opening; shorter explanation</tspan></text><rect x="840" y="600" width="680" height="165" rx="0" fill="#F4F0E8" stroke="#BDC4B6" stroke-width="2"/><text x="868" y="648" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="700"><tspan x="868" dy="0">03  LINKEDIN DRAFT</tspan></text><text x="868" y="700" fill="#2B2A28" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="400"><tspan x="868" dy="0">Self-contained observation</tspan><tspan x="868" dy="38">New structure; mobile line breaks</tspan></text><text x="80" y="820" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="400"><tspan x="80" dy="0">Change opening, structure, depth and action. Review before distribution.</tspan></text><text x="80" y="870" fill="#2F5D5A" font-family="DM Sans, Arial, sans-serif" font-size="29" font-weight="400"><tspan x="80" dy="0">The example email and LinkedIn drafts were not sent, posted or measured.</tspan></text>
</svg>