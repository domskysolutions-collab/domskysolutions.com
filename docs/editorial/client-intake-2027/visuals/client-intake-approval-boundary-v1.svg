<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Proposed agent approval boundary</title><desc>Proposed agent route: draft, owner review, approval validation and external dispatch. Pending, declined or expired approvals hold the message; changed content needs new review.</desc><rect x="0" y="0" width="1600" height="900" fill="#F4F0E8"/><text x="80" y="100" font-family="Lora, Georgia, serif" font-size="54" font-weight="600" fill="#2B2A28" text-anchor="start"><tspan x="80" dy="0">Proposed agent approval boundary</tspan></text><polyline points="80,142 1520,142" fill="none" stroke="#B99963" stroke-width="3" stroke-linejoin="round"/><rect x="435" y="184" width="1085" height="650" fill="#DFE7DE"/><rect x="80" y="250" width="330" height="250" fill="#F4F0E8" stroke="#BDC4B6" stroke-width="2"/><text x="104" y="290" font-family="DM Sans, Arial, sans-serif" font-size="27" font-weight="600" fill="#2F5D5A" text-anchor="start"><tspan x="104" dy="0">01</tspan></text><text x="104" y="345" font-family="DM Sans, Arial, sans-serif" font-size="42" font-weight="600" fill="#2B2A28" text-anchor="start"><tspan x="104" dy="0">Agent</tspan><tspan x="104" dy="49">proposes</tspan></text><text x="104" y="438" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#2F5D5A" text-anchor="start"><tspan x="104" dy="0">Read-only tools</tspan><tspan x="104" dy="33">+ a draft</tspan></text><polyline points="410,365 450,365" fill="none" stroke="#2F5D5A" stroke-width="4" stroke-linejoin="round"/><path d="M438 357L450 365L438 373" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="450" y="250" width="330" height="250" fill="#F4F0E8" stroke="#BDC4B6" stroke-width="2"/><text x="474" y="290" font-family="DM Sans, Arial, sans-serif" font-size="27" font-weight="600" fill="#2F5D5A" text-anchor="start"><tspan x="474" dy="0">02</tspan></text><text x="474" y="345" font-family="DM Sans, Arial, sans-serif" font-size="42" font-weight="600" fill="#2B2A28" text-anchor="start"><tspan x="474" dy="0">Owner</tspan><tspan x="474" dy="49">reviews</tspan></text><text x="474" y="438" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#2F5D5A" text-anchor="start"><tspan x="474" dy="0">Recipient, message</tspan><tspan x="474" dy="33">and action</tspan></text><polyline points="780,365 820,365" fill="none" stroke="#2F5D5A" stroke-width="4" stroke-linejoin="round"/><path d="M808 357L820 365L808 373" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="820" y="250" width="330" height="250" fill="#F4F0E8" stroke="#BDC4B6" stroke-width="2"/><text x="844" y="290" font-family="DM Sans, Arial, sans-serif" font-size="27" font-weight="600" fill="#2F5D5A" text-anchor="start"><tspan x="844" dy="0">03</tspan></text><text x="844" y="345" font-family="DM Sans, Arial, sans-serif" font-size="42" font-weight="600" fill="#2B2A28" text-anchor="start"><tspan x="844" dy="0">Validate</tspan><tspan x="844" dy="49">approval</tspan></text><text x="844" y="438" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#2F5D5A" text-anchor="start"><tspan x="844" dy="0">Same proposal</tspan><tspan x="844" dy="33">and policy version</tspan></text><polyline points="1150,365 1190,365" fill="none" stroke="#2F5D5A" stroke-width="4" stroke-linejoin="round"/><path d="M1178 357L1190 365L1178 373" fill="none" stroke="#2F5D5A" stroke-width="4"/><rect x="1190" y="250" width="330" height="250" fill="#F4F0E8" stroke="#BDC4B6" stroke-width="2"/><text x="1214" y="290" font-family="DM Sans, Arial, sans-serif" font-size="27" font-weight="600" fill="#2F5D5A" text-anchor="start"><tspan x="1214" dy="0">04</tspan></text><text x="1214" y="345" font-family="DM Sans, Arial, sans-serif" font-size="42" font-weight="600" fill="#2B2A28" text-anchor="start"><tspan x="1214" dy="0">Dispatcher</tspan><tspan x="1214" dy="49">sends</tspan></text><text x="1214" y="438" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#2F5D5A" text-anchor="start"><tspan x="1214" dy="0">Only the exact</tspan><tspan x="1214" dy="33">approved message</tspan></text><text x="800" y="232" font-family="DM Sans, Arial, sans-serif" font-size="23" font-weight="600" fill="#2F5D5A" text-anchor="middle"><tspan x="800" dy="0">Approve</tspan></text><text x="1170" y="232" font-family="DM Sans, Arial, sans-serif" font-size="23" font-weight="600" fill="#2F5D5A" text-anchor="middle"><tspan x="1170" dy="0">Valid</tspan></text><polyline points="540,500 540,662 565,662" fill="none" stroke="#2F5D5A" stroke-width="4" stroke-linejoin="round"/><path d="M553 654L565 662L553 670" fill="none" stroke="#2F5D5A" stroke-width="4"/><text x="700" y="546" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#2F5D5A" text-anchor="middle"><tspan x="700" dy="0">Pending, declined</tspan><tspan x="700" dy="32">or expired</tspan></text><rect x="565" y="610" width="270" height="104" fill="#F4F0E8" stroke="#BDC4B6" stroke-width="2"/><text x="700" y="674" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#2B2A28" text-anchor="middle"><tspan x="700" dy="0">Hold — no send</tspan></text><polyline points="985,500 985,610" fill="none" stroke="#2F5D5A" stroke-width="4" stroke-linejoin="round"/><path d="M977 598L985 610L993 598" fill="none" stroke="#2F5D5A" stroke-width="4"/><text x="1150" y="546" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#2F5D5A" text-anchor="middle"><tspan x="1150" dy="0">Recipient, body, action</tspan><tspan x="1150" dy="32">or policy changed</tspan></text><rect x="850" y="610" width="300" height="104" fill="#F4F0E8" stroke="#BDC4B6" stroke-width="2"/><text x="1000" y="650" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#2B2A28" text-anchor="middle"><tspan x="1000" dy="0">New review</tspan><tspan x="1000" dy="37">required</tspan></text><polyline points="985,714 985,785 490,785 490,500" fill="none" stroke="#2F5D5A" stroke-width="4" stroke-linejoin="round"/><path d="M482 512L490 500L498 512" fill="none" stroke="#2F5D5A" stroke-width="4"/><text x="725" y="766" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#2F5D5A" text-anchor="middle"><tspan x="725" dy="0">Return to owner review</tspan></text></svg>
