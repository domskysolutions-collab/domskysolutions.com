<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img"><title>Proposed agent approval boundary — mobile</title><desc>Proposed agent route: draft, owner review, approval validation and external dispatch. Pending, declined or expired approvals hold the message; changed content needs new review.</desc><rect x="0" y="0" width="1000" height="1500" fill="#F4F0E8"/><text x="70" y="82" font-family="Lora, Georgia, serif" font-size="52" font-weight="600" fill="#2B2A28" text-anchor="start"><tspan x="70" dy="0">Proposed agent</tspan><tspan x="70" dy="60">approval boundary</tspan></text><polyline points="70,165 930,165" fill="none" stroke="#B99963" stroke-width="3" stroke-linejoin="round"/><rect x="70" y="210" width="860" height="170" fill="#F4F0E8" stroke="#BDC4B6" stroke-width="2"/><text x="100" y="262" font-family="DM Sans, Arial, sans-serif" font-size="36" font-weight="600" fill="#2F5D5A" text-anchor="start"><tspan x="100" dy="0">01</tspan></text><text x="195" y="268" font-family="DM Sans, Arial, sans-serif" font-size="52" font-weight="600" fill="#2B2A28" text-anchor="start"><tspan x="195" dy="0">Agent proposes</tspan></text><text x="195" y="322" font-family="DM Sans, Arial, sans-serif" font-size="38" font-weight="400" fill="#2F5D5A" text-anchor="start"><tspan x="195" dy="0">Read-only tools + a draft</tspan></text><rect x="70" y="440" width="860" height="170" fill="#DFE7DE" stroke="#BDC4B6" stroke-width="2"/><text x="100" y="492" font-family="DM Sans, Arial, sans-serif" font-size="36" font-weight="600" fill="#2F5D5A" text-anchor="start"><tspan x="100" dy="0">02</tspan></text><text x="195" y="498" font-family="DM Sans, Arial, sans-serif" font-size="52" font-weight="600" fill="#2B2A28" text-anchor="start"><tspan x="195" dy="0">Owner reviews</tspan></text><text x="195" y="552" font-family="DM Sans, Arial, sans-serif" font-size="38" font-weight="400" fill="#2F5D5A" text-anchor="start"><tspan x="195" dy="0">Recipient, message and action</tspan></text><rect x="70" y="850" width="860" height="170" fill="#DFE7DE" stroke="#BDC4B6" stroke-width="2"/><text x="100" y="902" font-family="DM Sans, Arial, sans-serif" font-size="36" font-weight="600" fill="#2F5D5A" text-anchor="start"><tspan x="100" dy="0">03</tspan></text><text x="195" y="908" font-family="DM Sans, Arial, sans-serif" font-size="52" font-weight="600" fill="#2B2A28" text-anchor="start"><tspan x="195" dy="0">Validate approval</tspan></text><text x="195" y="962" font-family="DM Sans, Arial, sans-serif" font-size="38" font-weight="400" fill="#2F5D5A" text-anchor="start"><tspan x="195" dy="0">Same proposal and policy version</tspan></text><rect x="70" y="1290" width="860" height="160" fill="#F4F0E8" stroke="#BDC4B6" stroke-width="2"/><text x="100" y="1342" font-family="DM Sans, Arial, sans-serif" font-size="36" font-weight="600" fill="#2F5D5A" text-anchor="start"><tspan x="100" dy="0">04</tspan></text><text x="195" y="1348" font-family="DM Sans, Arial, sans-serif" font-size="52" font-weight="600" fill="#2B2A28" text-anchor="start"><tspan x="195" dy="0">Dispatcher sends</tspan></text><text x="195" y="1402" font-family="DM Sans, Arial, sans-serif" font-size="38" font-weight="400" fill="#2F5D5A" text-anchor="start"><tspan x="195" dy="0">Only the exact approved message</tspan></text><polyline points="500,380 500,440" fill="none" stroke="#2F5D5A" stroke-width="4" stroke-linejoin="round"/><path d="M492 428L500 440L508 428" fill="none" stroke="#2F5D5A" stroke-width="4"/><polyline points="80,610 80,747 90,747" fill="none" stroke="#2F5D5A" stroke-width="4" stroke-linejoin="round"/><path d="M78 739L90 747L78 755" fill="none" stroke="#2F5D5A" stroke-width="4"/><text x="300" y="641" font-family="DM Sans, Arial, sans-serif" font-size="34" font-weight="400" fill="#2F5D5A" text-anchor="middle"><tspan x="300" dy="0">Pending / declined</tspan><tspan x="300" dy="36">or expired</tspan></text><rect x="90" y="690" width="420" height="115" fill="#F4F0E8" stroke="#BDC4B6" stroke-width="2"/><text x="300" y="758" font-family="DM Sans, Arial, sans-serif" font-size="46" font-weight="600" fill="#2B2A28" text-anchor="middle"><tspan x="300" dy="0">Hold — no send</tspan></text><polyline points="740,610 740,827 500,827 500,850" fill="none" stroke="#2F5D5A" stroke-width="4" stroke-linejoin="round"/><path d="M492 838L500 850L508 838" fill="none" stroke="#2F5D5A" stroke-width="4"/><text x="754" y="686" font-family="DM Sans, Arial, sans-serif" font-size="37" font-weight="600" fill="#2F5D5A" text-anchor="start"><tspan x="754" dy="0">Approve</tspan></text><polyline points="80,1020 80,1170 90,1170" fill="none" stroke="#2F5D5A" stroke-width="4" stroke-linejoin="round"/><path d="M78 1162L90 1170L78 1178" fill="none" stroke="#2F5D5A" stroke-width="4"/><text x="300" y="1050" font-family="DM Sans, Arial, sans-serif" font-size="32" font-weight="400" fill="#2F5D5A" text-anchor="middle"><tspan x="300" dy="0">Recipient, body, action</tspan><tspan x="300" dy="34">or policy changed</tspan></text><rect x="90" y="1092" width="420" height="160" fill="#F4F0E8" stroke="#BDC4B6" stroke-width="2"/><text x="300" y="1139" font-family="DM Sans, Arial, sans-serif" font-size="46" font-weight="600" fill="#2B2A28" text-anchor="middle"><tspan x="300" dy="0">New review</tspan><tspan x="300" dy="50">required</tspan></text><text x="300" y="1230" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#2F5D5A" text-anchor="middle"><tspan x="300" dy="0">Return to owner review</tspan></text><polyline points="740,1020 740,1267 500,1267 500,1290" fill="none" stroke="#2F5D5A" stroke-width="4" stroke-linejoin="round"/><path d="M492 1278L500 1290L508 1278" fill="none" stroke="#2F5D5A" stroke-width="4"/><text x="754" y="1090" font-family="DM Sans, Arial, sans-serif" font-size="37" font-weight="600" fill="#2F5D5A" text-anchor="start"><tspan x="754" dy="0">Valid</tspan><tspan x="754" dy="43">approval</tspan></text></svg>
